name: Збірка APK

# Запускається автоматично після кожної зміни коду,
# а також вручну кнопкою "Run workflow" на вкладці Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити код
        uses: actions/checkout@v4

      - name: Встановити Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Встановити Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Створити Android-частину проєкту
        # Додає службові файли Android, яких немає в репозиторії.
        # Наш код у lib/ не перезаписується.
        run: flutter create --platforms=android --org app.debates --project-name debates .

      - name: Назва застосунку на телефоні
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Дебати"/' android/app/src/main/AndroidManifest.xml

      - name: Завантажити залежності
        run: flutter pub get

      - name: Зібрати APK
        run: flutter build apk --release

      - name: Опублікувати APK у Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Тестова збірка ${{ github.run_number }}
          body: Завантаж файл app-release.apk і встанови його на телефон.
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
