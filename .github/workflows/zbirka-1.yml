name: Збірка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Завантажити код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Впорядкувати назви файлів (прибрати «-1», «-2»…)
        # Якщо телефон зберіг файл як main-3.dart, debatos-1.js тощо,
        # беремо НАЙНОВІШИЙ, даємо йому правильну назву, старі видаляємо
        # і зберігаємо це на GitHub. Вручну нічого перейменовувати не треба.
        run: |
          shopt -s nullglob
          tidy() {
            target="$1"; shift
            newest=""; nt=-1
            for f in "$@"; do
              t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
              if [ "$t" -ge "$nt" ]; then newest="$f"; nt="$t"; fi
            done
            [ -z "$newest" ] && return 0
            for f in "$@"; do
              [ "$f" = "$newest" ] && continue
              git rm -q "$f"
            done
            if [ "$newest" != "$target" ]; then git mv "$newest" "$target"; fi
            return 0
          }
          tidy lib/main.dart lib/main*.dart
          tidy pubspec.yaml pubspec*.yaml
          tidy icon.png icon*.png
          tidy server/debatos.js server/debatos*.js
          tidy server/pages.js server/pages*.js
          tidy server/wrangler.json server/wrangler*.json
          if grep -q '"debatos.js"' server/wrangler.json 2>/dev/null; then
            git rm -q --ignore-unmatch 'server/worker*.js'
          fi
          git rm -q --ignore-unmatch 'lib/*.zip'
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898699+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Авто: впорядковано назви файлів"
            git push || echo "Не вдалося зберегти (можливо, паралельна зміна) — не страшно"
          fi
          git status --short
          ls -la . lib server

      - name: Встановити Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Встановити Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Створити Android-частину проєкту
        run: flutter create --platforms=android --org app.debates --project-name debates .

      - name: Назва застосунку і доступ до інтернету
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Debatos"/' $M
          grep -q 'android.permission.INTERNET' $M || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          # щоб відкривати сторінки (умови, політика) у браузері
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n</manifest>#' $M
          # постійний ідентифікатор застосунку в Google Play (змінювати не можна!)
          for G in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f $G ] && sed -i -E 's/applicationId( = |\s+)"[^"]*"/applicationId\1"app.debatos"/' $G && grep -n applicationId $G
          done
          true

      - name: Шрифти (вбудовуються в застосунок)
        run: |
          mkdir -p fonts
          G=https://raw.githubusercontent.com/google/fonts/main/ofl
          curl -sSfL -o /tmp/Alegreya.ttf "$G/alegreya/Alegreya%5Bwght%5D.ttf"
          curl -sSfL -o fonts/CormorantSC-SemiBold.ttf "$G/cormorantsc/CormorantSC-SemiBold.ttf"
          curl -sSfL -o fonts/CormorantSC-Bold.ttf "$G/cormorantsc/CormorantSC-Bold.ttf"
          python3 -m pip install -q --break-system-packages fonttools || python3 -m pip install -q fonttools
          python3 -m fontTools.varLib.instancer /tmp/Alegreya.ttf wght=400 -q -o fonts/Alegreya-Regular.ttf
          python3 -m fontTools.varLib.instancer /tmp/Alegreya.ttf wght=700 -q -o fonts/Alegreya-Bold.ttf
          ls -la fonts

      - name: Іконка застосунку
        run: |
          if [ ! -f icon.png ]; then echo "Іконки немає — залишаю стандартну"; exit 0; fi
          command -v convert >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q imagemagick)
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${pair%%:*}; size=${pair##*:}
            convert icon.png -resize ${size}x${size} android/app/src/main/res/mipmap-$dir/ic_launcher.png
          done

      - name: Постійний ключ підпису
        # Однаковий ключ у кожній збірці — тоді нова версія ставиться
        # поверх старої без видалення. Лише для тестових збірок,
        # для Google Play зробимо окремий ключ.
        run: |
          echo "" | base64 -d > "$GITHUB_WORKSPACE/test-signing.keystore"
          K="$GITHUB_WORKSPACE/test-signing.keystore"
          if [ -f android/app/build.gradle.kts ]; then
            printf '\nandroid {\n    signingConfigs {\n        getByName("debug") {\n            storeFile = file("%s")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n}\n' "$K" >> android/app/build.gradle.kts
            tail -n 12 android/app/build.gradle.kts
          else
            printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file("%s")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n}\n' "$K" >> android/app/build.gradle
            tail -n 12 android/app/build.gradle
          fi

      - name: Завантажити залежності
        run: flutter pub get

      - name: Зібрати APK
        run: flutter build apk --release

      - name: Відбиток підпису (має бути однаковий у всіх збірках)
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -i sha256 || true

      - name: Збірка для Google Play (AAB, ключ завантаження)
        # Ключ лежить тут зашифрованим; пароль — лише в секреті UPLOAD_KEY_PASSWORD.
        # Без секрету цей крок пропускається, APK все одно збирається.
        env:
          UPLOAD_PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_PW" ]; then echo "Секрету UPLOAD_KEY_PASSWORD немає — AAB не збираю"; exit 0; fi
          echo "" | base64 -d > "$GITHUB_WORKSPACE/upload.jks"
          K="$GITHUB_WORKSPACE/upload.jks"
          G=android/app/build.gradle.kts
          if [ -f $G ]; then
            printf '\nandroid {\n    signingConfigs {\n        getByName("debug") {\n            storeFile = file("%s")\n            storePassword = "%s"\n            keyAlias = "upload"\n            keyPassword = "%s"\n        }\n    }\n}\n' "$K" "$UPLOAD_PW" "$UPLOAD_PW" >> $G
          else
            printf '\nandroid {\n    signingConfigs {\n        debug {\n            storeFile file("%s")\n            storePassword "%s"\n            keyAlias "upload"\n            keyPassword "%s"\n        }\n    }\n}\n' "$K" "$UPLOAD_PW" "$UPLOAD_PW" >> android/app/build.gradle
          fi
          flutter build appbundle --release
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -i sha256 || true

      - name: Дата збірки
        run: echo "BUILD_DATE=$(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M')" >> $GITHUB_ENV

      - name: Опублікувати APK у Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v-${{ github.run_id }}
          name: Збірка ${{ env.BUILD_DATE }}
          body: |
            app-release.apk — встановити на телефон.
            app-release.aab — для Google Play.
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
